<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- fonts.conf plus the deck's own fonts, and rules for "Family Style" names as decks write them. -->
<fontconfig>
  <include>fonts.conf</include>
  <dir prefix="relative">fonts-download</dir>
  <match target="pattern">
    <test name="family"><string>Open Sans Semibold</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Open Sans</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>semibold</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>League Gothic Regular</string></test>
    <edit name="family" mode="assign" binding="strong"><string>League Gothic</string></edit>
  </match>
</fontconfig>
