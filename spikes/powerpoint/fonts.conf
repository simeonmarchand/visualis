<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Lets headless LibreOffice see the Mac's fonts (it otherwise only sees its own). -->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <dir>/Applications/LibreOffice.app/Contents/Resources/fonts</dir>
  <!-- A font the Mac doesn't have falls back to a plain sans, not whatever sorts first. -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak"><string>Helvetica Neue</string></edit>
  </match>
  <cachedir>~/Library/Caches/visualis-fontconfig</cachedir>
</fontconfig>
