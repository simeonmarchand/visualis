name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older run, to save macOS minutes
# (private repos count them 10x).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"   # matches Homebrew's Qt on the development Mac
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

      - name: Lint QML
        run: cmake --build --preset ci --target all_qmllint
